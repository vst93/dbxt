name: Release

# Manual release. Computes the next version (or takes one), tags it (no `v`
# prefix — the project's version convention), creates the GitHub release, then
# builds one archive per platform and attaches them together with a `.sha256`.
#
# Why the matrix looks like this (cross-compilation note):
#   dbxt's dependency graph is NOT pure Rust. `dbx-core` vendors OpenSSL
#   (`openssl-src`, built through OpenSSL's own `./Configure` + make), `russh` /
#   `rustls` pull in `aws-lc-sys`, and sqlite / zstd are compiled from C sources
#   as well. Every artifact therefore needs a working C toolchain *for its own
#   target*. Native runners (plus `musl-tools` for the static Linux rows, which
#   is a well-trodden local cross-compile) are the only path that needs no
#   exotic tooling — see `linux_build` below for the `cross` fallback.
#
#   The `gnu` Linux artifacts link the runner's glibc (Ubuntu 24.04 → glibc
#   2.39); the `musl` artifacts are fully static and have no glibc requirement.
#   Prefer `musl` on older distributions.
#
#   Android/Termux has no dedicated artifact: `dbxt-linux-arm64-musl.zip` is a
#   static aarch64 binary and often runs on Termux, otherwise build from source
#   with `pkg install rust`.
#
# Cross-compilation strategy — native runners, not `zigbuild`:
#   * `cargo-zigbuild` was evaluated first. It would let one x86_64 runner emit
#     every target, and it would in fact cover the `cc`-driven crates. It was
#     rejected because the vendored OpenSSL does **not** go through `cc`/cmake:
#     `openssl-src` shells out to OpenSSL's own `./Configure` + make, and only
#     uses `cc-rs` to *locate* a compiler and pass it as `CC=`. Handing that a
#     `zig cc` shim is not a supported OpenSSL configuration, and this project
#     has no CI budget to validate an exotic toolchain. (For the record,
#     `aws-lc-sys` 0.44 no longer needs cmake for our targets: it ships prebuilt
#     bindings — and therefore uses its plain `cc` builder — for all seven of
#     x86_64/aarch64 × linux-gnu/linux-musl/apple-darwin plus windows-msvc.)
#   * `cross-rs/cross` is kept as the fallback for the aarch64 Linux rows
#     (`linux_build: cross`), where its container images do carry a full C
#     toolchain (gcc + musl-gcc). It is *not* the default because the arm64 rows
#     can run natively on GitHub's arm64 runners.
#   * Everything else is built on a runner of the matching OS/arch, which needs
#     no cross C toolchain at all.
#   * macOS Intel is cross-built from the arm64 runner: Rust ships the std for
#     `x86_64-apple-darwin`, the Apple SDK is universal, and `cc-rs` (used by
#     `openssl-src` to pick `CC` and by the `-sys` crates) passes the right
#     `-arch`. `macos-13`, the old Intel image, has been retired, so there is no
#     alternative anyway.
#   * Windows x86_64 needs NASM for the `aws-lc-sys` assembly (installed below).
#   * `ubuntu-24.04-arm` is GitHub's hosted arm64 image (available for public
#     repositories). If this repo ever goes private, switch `linux_build` to
#     `cross` rather than paying for arm64 runners.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 0.2.0 (no `v` prefix). Empty = bump the patch of the latest tag (a pre-release tag is promoted to its final version); 0.1.0 when no tag exists.'
        required: false
        default: ''
      notes:
        description: 'Release notes. Empty = auto-generate from commits.'
        required: false
        default: ''
      prerelease:
        description: 'Mark as pre-release (true/false). Auto-true when the version contains -alpha/-beta/-preview/-rc.'
        required: false
        default: 'false'
      linux_build:
        description: 'How to build the aarch64 Linux artifacts.'
        type: choice
        options:
          - native
          - cross
        default: native

permissions:
  contents: write

env:
  BINARY_NAME: dbxt
  CARGO_TERM_COLOR: always

jobs:
  # ── Determine version, create tag, create release ─────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      notes: ${{ steps.notes.outputs.notes }}
      prerelease: ${{ steps.prerelease.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          CURRENT=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          CURRENT="${CURRENT#v}"
          INPUT="${{ inputs.version }}"
          INPUT="${INPUT#v}"
          if [ -n "$INPUT" ]; then
            VERSION="$INPUT"
          elif [ -z "$CURRENT" ]; then
            # First ever release.
            VERSION="0.1.0"
          else
            BASE_VERSION="${CURRENT%%-*}"
            MAJOR=$(echo "$BASE_VERSION" | cut -d. -f1)
            MINOR=$(echo "$BASE_VERSION" | cut -d. -f2)
            PATCH=$(echo "$BASE_VERSION" | cut -d. -f3)
            if [ "$CURRENT" != "$BASE_VERSION" ]; then
              # The newest tag is a pre-release (0.2.0-rc1): promote it to the
              # final release it was leading up to instead of bumping past it,
              # otherwise 0.2.0 could never be released without typing it.
              VERSION="${MAJOR}.${MINOR}.${PATCH}"
            else
              PATCH=$((10#${PATCH:-0} + 1))
              VERSION="${MAJOR}.${MINOR}.${PATCH}"
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Current: ${CURRENT:-<none>} -> New: $VERSION"

      - name: Determine prerelease
        id: prerelease
        run: |
          PRERELEASE="${{ inputs.prerelease }}"
          VERSION="${{ steps.version.outputs.version }}"
          # Auto-detect prerelease from the version string (-alpha/-beta/-preview/-rc).
          # `-e` is required: the pattern starts with `-`, which grep would
          # otherwise try to parse as an option.
          if echo "$VERSION" | grep -qiE -e '-(alpha|beta|preview|rc)'; then
            PRERELEASE="true"
          fi
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        env:
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          if [ -n "$INPUT_NOTES" ]; then
            NOTES="$INPUT_NOTES"
          else
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -n "$LAST_TAG" ]; then
              COMMITS=$(git log "$LAST_TAG..HEAD" --pretty=format:"- %s" --no-merges)
            else
              COMMITS=$(git log --pretty=format:"- %s" --no-merges -20)
            fi
            NOTES=$(printf '## Changes\n\n%s\n\n---\n\n## Install\n\n| File | Platform |\n|------|----------|\n| `dbxt-linux-amd64.zip` | Linux (x86_64, glibc) |\n| `dbxt-linux-arm64.zip` | Linux (ARM64, glibc) |\n| `dbxt-linux-amd64-musl.zip` | Linux (x86_64, static) |\n| `dbxt-linux-arm64-musl.zip` | Linux (ARM64, static) |\n| `dbxt-darwin-amd64.zip` | macOS (Intel) |\n| `dbxt-darwin-arm64.zip` | macOS (Apple Silicon) |\n| `dbxt-windows-amd64.zip` | Windows (x86_64) |\n\nOne-liner (Linux / macOS):\n\n```sh\ncurl -fsSL https://raw.githubusercontent.com/vst93/dbxt/refs/heads/master/cmd/install.sh | bash\n```\n\nAndroid/Termux: no dedicated artifact — `dbxt-linux-arm64-musl.zip` is a static aarch64 binary and usually works, otherwise build from source (`pkg install rust`).\n' "$COMMITS")
            # (The template above deliberately contains no `${VERSION}` placeholder;
            # the release title carries the version. Substitute before encoding if
            # you ever add one.)
          fi
          NOTES="${NOTES//'%'/'%25'}"
          NOTES="${NOTES//$'\n'/'%0A'}"
          NOTES="${NOTES//$'\r'/'%0D'}"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Tag and push (no v prefix)
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$VERSION"
          git push origin "$VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PRERELEASE="${{ steps.prerelease.outputs.prerelease }}"
          # Decode the percent-encoded notes back to real newlines
          NOTES=$(printf '%b' "${NOTES//%/\\x}")
          EXTRA_ARGS=""
          if [ "$PRERELEASE" = "true" ]; then
            EXTRA_ARGS="--prerelease"
          fi
          gh release create "$VERSION" \
            --title "dbxt $VERSION" \
            --notes "$NOTES" \
            --target master \
            $EXTRA_ARGS

  # ── Build one archive per platform ────────────────────────────────────────
  build:
    name: ${{ matrix.asset }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (glibc) — native runner
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            asset: dbxt-linux-amd64.zip
            tool: native
            libc: gnu
          # Linux ARM64 (glibc) — native arm64 runner, `cross` on demand
          - target: aarch64-unknown-linux-gnu
            runner: ${{ inputs.linux_build == 'cross' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
            asset: dbxt-linux-arm64.zip
            tool: ${{ inputs.linux_build }}
            libc: gnu
          # Linux x86_64 (static musl) — native + musl-tools
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            asset: dbxt-linux-amd64-musl.zip
            tool: native
            libc: musl
          # Linux ARM64 (static musl) — native arm64 + musl-tools, `cross` on demand
          - target: aarch64-unknown-linux-musl
            runner: ${{ inputs.linux_build == 'cross' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
            asset: dbxt-linux-arm64-musl.zip
            tool: ${{ inputs.linux_build }}
            libc: musl
          # macOS Apple Silicon
          - target: aarch64-apple-darwin
            runner: macos-latest
            asset: dbxt-darwin-arm64.zip
            tool: native
          # macOS Intel (cross-built from the arm64 runner; the Apple SDK and
          # clang target both architectures)
          - target: x86_64-apple-darwin
            runner: macos-latest
            asset: dbxt-darwin-amd64.zip
            tool: native
          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            asset: dbxt-windows-amd64.zip
            tool: native

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Fallback path only: `linux_build: cross` builds the aarch64 rows in a
      # cross-rs container instead of on the native arm64 runner.
      - name: Install cross
        if: matrix.tool == 'cross'
        uses: taiki-e/install-action@cross

      # Static musl builds need a musl C toolchain for the vendored C sources
      # (OpenSSL, aws-lc, sqlite, zstd). `cross` brings its own.
      - name: Install musl toolchain
        if: matrix.libc == 'musl' && matrix.tool == 'native'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # aws-lc-sys assembles x86_64 asm with NASM on Windows.
      - name: Install NASM
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Build and package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          if [ "${{ matrix.tool }}" = "cross" ]; then
            cross build --release --locked --target "$TARGET"
          else
            cargo build --release --locked --target "$TARGET"
          fi
          mkdir -p dist
          cp "target/$TARGET/release/${BINARY_NAME}" "dist/${BINARY_NAME}"
          cd dist
          zip "${{ matrix.asset }}" "${BINARY_NAME}"
          # macOS has no GNU sha256sum
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}" | awk '{print $1}' > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" | awk '{print $1}' > "${{ matrix.asset }}.sha256"
          fi
          ls -l

      - name: Build and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --locked --target "${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/$env:BINARY_NAME.exe" "dist/$env:BINARY_NAME.exe"
          Compress-Archive -Path "dist/$env:BINARY_NAME.exe" -DestinationPath "dist/${{ matrix.asset }}" -Force
          $hash = (Get-FileHash "dist/${{ matrix.asset }}" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "dist/${{ matrix.asset }}.sha256" -Value $hash -NoNewline -Encoding ascii
          Get-ChildItem dist

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          files: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          fail_on_unmatched_files: true
