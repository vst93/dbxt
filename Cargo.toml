[package]
name = "dbxt"
version = "0.0.5"
edition = "2021"
description = "Terminal UI client for DBX — reuse dbx connections and drivers in any terminal"
license = "Apache-2.0"

[dependencies]
dbx-core = { git = "https://github.com/t8y2/dbx", tag = "v0.6.34", default-features = false, features = [
    "sqlite-bundled",
    "os-keyring",
] }
dbx-mcp = { git = "https://github.com/t8y2/dbx", tag = "v0.6.34", default-features = false, features = [
    "sqlite-bundled",
    "duckdb-sidecar",
] }
# R117: `dbxt mcp` serves DBX's own MCP server (`dbx_mcp::DbxMcpServer`) rather
# than reimplementing any tool. rmcp is only needed for the stdio transport
# wrapper; it is already in the lock via dbx-mcp, so this adds no new crate to
# the build.
rmcp = { version = "2.2.0", features = ["transport-io"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tui-textarea = "0.7"
unicode-width = "0.2"
encoding_rs = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
futures = "0.3"
anyhow = "1"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
# R101: local HH:MM for the result-snapshot label (already in the lock via
# dbx-core, so this adds no new crate to the build).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
# R105: read the streamed XLSX back in tests (already in the lock via dbx-core,
# so no new crate is compiled).
zip = { version = "4", default-features = false, features = ["deflate"] }

[patch.crates-io]
tokio-postgres = { git = "https://github.com/t8y2/tokio-postgres-gaussdb.git", rev = "ac8ad476de59093d33ab9f294531c956e0c6a724" }
postgres-types = { git = "https://github.com/t8y2/tokio-postgres-gaussdb.git", rev = "ac8ad476de59093d33ab9f294531c956e0c6a724" }
postgres-protocol = { git = "https://github.com/t8y2/tokio-postgres-gaussdb.git", rev = "ac8ad476de59093d33ab9f294531c956e0c6a724" }
mysql_async = { git = "https://github.com/zipg/mysql_async.git", rev = "4a9e60a62f5a48e35ef9ccc9fc8277d5012b19dd" }

[profile.release]
strip = true
lto = "thin"
opt-level = 2
